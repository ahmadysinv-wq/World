const CHAPTERS=[{"name":"Ирбис","bg":"animals/chapter-irbis.png","facts":["Ирбис живёт в высоких горах Центральной Азии.","Его длинный хвост помогает сохранять равновесие на скалах.","Густой мех защищает ирбиса от сильного мороза.","Широкие лапы работают почти как природные снегоступы.","Ирбис отлично маскируется среди камней и снега.","Он способен совершать очень длинные прыжки по склонам.","Большую часть времени ирбис ведёт одиночный образ жизни.","Самки выращивают детёнышей без помощи самца.","Ирбис активен главным образом на рассвете и в сумерках.","В его рацион входят горные козлы, бараны и более мелкая добыча.","Ирбис редко нападает на человека.","Для отдыха он выбирает пещеры и защищённые расщелины.","Высокогорная среда требует от него большой выносливости.","Хвост ирбиса почти такой же длинный, как его тело.","Во время отдыха он может укрывать морду пушистым хвостом.","Ирбис не умеет рычать так, как крупные кошки рода Panthera.","Следы ирбиса помогают учёным изучать его без прямой встречи.","Главные угрозы виду — потеря добычи и конфликт с человеком.","Для сохранения ирбиса защищают большие горные территории.","Ты прошёл главу об ирбисе — карточка животного открыта!"]},{"name":"Аксолотль","bg":"animals/animal-00.jpg","facts":["Аксолотль родом из озёрной системы возле Мехико.","Он сохраняет личиночные признаки даже во взрослом возрасте.","Наружные жабры аксолотля похожи на пушистые веточки.","Он способен восстанавливать повреждённые конечности.","Аксолотль может регенерировать части некоторых органов.","В природе его окраска обычно темнее, чем у домашних форм.","Светлые розовые аксолотли особенно популярны в аквариумах.","Он охотится на мелких водных животных.","Аксолотль всасывает добычу резким движением рта.","Ему нужна прохладная и чистая вода.","Аксолотль относится к амбистомам — группе саламандр.","В природе его ареал сегодня очень ограничен.","Загрязнение воды угрожает диким популяциям.","Инвазивные рыбы могут поедать молодь и конкурировать за пищу.","У function buildCrossword(words){let placed=[],cells=new Map(),key=(r,c)=>r+','+c;function put(word,r,c,dir){for(let i=0;i<word.length;i++){let rr=r+(dir==='v'?i:0),cc=c+(dir==='h'?i:0);cells.set(key(rr,cc),word[i])}placed.push({word,r,c,dir})}put(words[0],0,0,'h');for(let wi=1;wi<words.length;wi++){let w=words[wi],done=false;outer:for(let p of placed){for(let i=0;i<w.length;i++)for(let j=0;j<p.word.length;j++)if(w[i]===p.word[j]){let dir=p.dir==='h'?'v':'h',r=p.r+(p.dir==='v'?j:0)-(dir==='v'?i:0),c=p.c+(p.dir==='h'?j:0)-(dir==='h'?i:0),ok=true;for(let k=0;k<w.length;k++){let rr=r+(dir==='v'?k:0),cc=c+(dir==='h'?k:0),ex=cells.get(key(rr,cc));if(ex&&ex!==w[k]){ok=false;break}}if(ok){put(w,r,c,dir);done=true;break outer}}}if(!done)put(w,placed.length*2,0,'h')}return {placed,cells}}
function renderWords(d=levelData()){let g=buildCrossword(d.words),coords=[...g.cells.keys()].map(x=>x.split(',').map(Number)),minR=Math.min(...coords.map(x=>x[0])),maxR=Math.max(...coords.map(x=>x[0])),minC=Math.min(...coords.map(x=>x[1])),maxC=Math.max(...coords.map(x=>x[1])),box=$('crossword'),cw=34,gap=4,totalW=(maxC-minC+1)*(cw+gap),totalH=(maxR-minR+1)*(cw+gap),scale=Math.min(1,Math.min(360/Math.max(totalW,1),180/Math.max(totalH,1))),sz=cw*scale,sp=(cw+gap)*scale;box.innerHTML='';g.cells.forEach((ch,k)=>{let [r,c]=k.split(',').map(Number),el=document.createElement('div');el.className='cwcell '+(g.placed.some(p=>found.has(p.word)&&((p.dir==='h'&&r===p.r&&c>=p.c&&c<p.c+p.word.length)||(p.dir==='v'&&c===p.c&&r>=p.r&&r<p.r+p.word.length)))?'revealed':'empty');el.textContent=ch;el.style.width=sz+'px';el.style.height=sz+'px';el.style.left=`calc(50% + ${(c-minC)*sp-totalW*scale/2}px)`;el.style.top=((r-minR)*sp+4)+'px';box.appendChild(el)});$('foundcount').textContent=`Найдено ${found.size} из ${d.words.length}`}
function renderBonus(){let n=+(localStorage.wsBonusCount||0);$('bonuscount').textContent=n%10}
function renderWheel(){let wheel=$('wheel');wheel.querySelectorAll('.node').forEach(n=>n.remove());$('lines').innerHTML='';let n=letters.length;letters.forEach((ch,i)=>{let a=-Math.PI/2+i*2*Math.PI/n,x=50+35*Math.cos(a),y=50+35*Math.sin(a);let b=document.createElement('div');b.className='node';b.textContent=ch;b.dataset.i=i;b.style.left=x+'%';b.style.top=y+'%';wheel.appendChild(b)});}
function nodeAt(x,y){let el=document.elementFromPoint(x,y);return el&&el.classList.contains('node')?el:null}
function begin(e){drag=true;path=[];clearPath();move(e)}function move(e){if(!drag)return;let p=e.touches?e.touches[0]:e,n=nodeAt(p.clientX,p.clientY);if(n&&!path.includes(n)){path.push(n);n.classList.add('sel');drawLines();$('current').textContent=path.map(x=>x.textContent).join('')}}
function end(){if(!drag)return;drag=false;let word=path.map(x=>x.textContent).join(''),d=levelData();if(d.words.includes(word)&&!found.has(word)){found.add(word);renderWords(d);toast('Найдено: '+word);if(found.size===d.words.length)setTimeout(win,450)}else if(word.length>=3&&canBuild(word,d.letters)&&BONUS_WORDS.includes(word)&&!d.words.includes(word)){let seen=new Set(JSON.parse(localStorage.wsBonusSeen||'[]')),tag=level+':'+word;if(!seen.has(tag)){seen.add(tag);localStorage.wsBonusSeen=JSON.stringify([...seen]);let n=+(localStorage.wsBonusCount||0)+1;localStorage.wsBonusCount=n;if(n%10===0){gems+=5;save();toast('✨ 10 доп. слов! +5 💎')}else toast('✨ Дополнительное слово: '+word);renderBonus();$('gems').textContent=gems}else toast('Это слово уже в копилке')}else if(word.length>1)toast('Такого слова здесь нет');clearPath()}
function clearPath(){path.forEach(n=>n.classList.remove('sel'));path=[];$('lines').innerHTML='';$('current').textContent=''}
function drawLines(){let svg=$('lines'),w=$('wheel'),r=w.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${r.width} ${r.height}`);svg.innerHTML='';for(let i=1;i<path.length;i++){let a=path[i-1].getBoundingClientRect(),b=path[i].getBoundingClientRect(),l=document.createElementNS('http://www.w3.org/2000/svg','line');l.setAttribute('x1',a.left+a.width/2-r.left);l.setAttribute('y1',a.top+a.height/2-r.top);l.setAttribute('x2',b.left+b.width/2-r.left);l.setAttribute('y2',b.top+b.height/2-r.top);svg.appendChild(l)}}
let wheel=$('wheel');wheel.addEventListener('pointerdown',e=>{e.preventDefault();wheel.setPointerCapture?.(e.pointerId);begin(e)});wheel.addEventListener('pointermove',e=>{if(drag){e.preventDefault();move(e)}});wheel.addEventListener('pointerup',end);wheel.addEventListener('pointercancel',end);
function win(){let old=level;if(old%5===0)gems+=2;streak++;level=Math.min(MAX_LEVEL,old+1);save();if(old%20===0){gems+=10;save();unlock(old/20-1,true)}else{toast(old%5===0?'Уровень пройден! +2 💎':'Уровень пройден!');render()}}
function unlock(i,advance=false){let a=rare[i]||rare[0];$('mphoto').src='animals/animal-'+String(i+1).padStart(2,'0')+'.jpg';$('mname').textContent=(advance?'🎉 Новое животное: ':'')+a[1];$('mdesc').textContent=a[2];$('mreward').textContent=advance?'Награда: +10 💎':'Карточка коллекции';$('modal').classList.add('show');$('close').dataset.advance=advance?'1':'0'}
function renderAnimals(){$('animals').innerHTML=rare.map((a,i)=>{let open=level-1>=(i+1)*20;return `<div class="animal ${open?'':'locked'}" data-animal="${i}" style="background:${open?`linear-gradient(#0000,#0008),url('animals/animal-${String(i+1).padStart(2,'0')}.jpg') center/cover`:'linear-gradient(145deg,#214b3e,#102a24)'}"><span>${open?a[1]:'🔒 Уровень '+((i+1)*20)}</span></div>`}).join('');document.querySelectorAll('.animal:not(.locked)').forEach(x=>x.onclick=()=>unlock(+x.dataset.animal,false))}
function save(){localStorage.ws08Level=level;localStorage.ws08Gems=gems;localStorage.ws08Streak=streak}
$('shuffle').onclick=()=>{letters=shuffle(letters);renderWheel()};$('hint').onclick=()=>{if(gems<10)return toast('Недостаточно алмазов');let d=levelData(),w=d.words.find(x=>!found.has(x));if(!w)return;gems-=10;save();found.add(w);renderWords(d);$('gems').textContent=gems;toast('Подсказка открыла слово: '+w);if(found.size===d.words.length)setTimeout(win,500)};$('close').onclick=()=>{$('modal').classList.remove('show');if($('close').dataset.advance==='1')render()};function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1300)}render();
</script></body></html>
